<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Site Editor</title>
<style>
:root{--bg:#0d0d0d;--panel:#161616;--panel2:#1e1e1e;--line:#2a2a2a;--ink:#f2f2f2;--muted:#9a9a9a;--accent:#e85002;--ok:#3fb27f;--warn:#e8a23a;--danger:#e5484d}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:13px/1.45 "Segoe UI",system-ui,sans-serif}
button,input,textarea,select{font:inherit;color:inherit}
button{background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:6px 11px;cursor:pointer;white-space:nowrap}
button:hover:not(:disabled){border-color:#555}
button:disabled{opacity:.4;cursor:default}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
button.danger{color:var(--danger)}
button.on{background:#2b2b2b;border-color:#666}
input,textarea,select{background:#0f0f0f;border:1px solid var(--line);border-radius:7px;padding:6px 8px;width:100%}
textarea{resize:vertical;min-height:70px;font-family:ui-monospace,Consolas,monospace;font-size:12px}
textarea.text{font-family:inherit;font-size:13px}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent)}
.app{display:grid;grid-template-rows:48px 1fr;height:100vh}
.top{display:flex;align-items:center;gap:8px;padding:0 10px;border-bottom:1px solid var(--line);background:var(--panel)}
.top .brand{font-weight:700;letter-spacing:.02em;margin-right:6px}
.top select{width:auto;min-width:220px}
.top .grp{display:flex;gap:4px}
.top .sp{flex:1}
.status{color:var(--muted);font-size:12px;margin-right:6px;max-width:320px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.status.dirty{color:var(--warn)}
.status.saved{color:var(--ok)}
.main{display:grid;grid-template-columns:260px 1fr 330px;min-height:0}
.side{background:var(--panel);border-right:1px solid var(--line);overflow:auto;min-height:0}
.insp{background:var(--panel);border-left:1px solid var(--line);overflow:auto;min-height:0;padding:12px}
.side h3,.insp h3{margin:0;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.side h3{padding:12px 12px 6px}
.sidehead{display:flex;align-items:center;justify-content:space-between;padding-right:8px}
.ltools{display:flex;gap:3px}.ltools button{padding:2px 7px;font-size:12px;line-height:18px;min-width:24px}
.ltip{padding:0 12px;margin:0 0 14px}
.node.dragging{opacity:.4}
.node.drop-before{box-shadow:inset 0 2px 0 #4aa3ff}.node.drop-after{box-shadow:inset 0 -2px 0 #4aa3ff}
.node.drop-inside{background:rgba(74,163,255,.22);outline:1px solid #4aa3ff}.node.drop-no{background:rgba(255,60,60,.12)}
.stage{position:relative;display:flex;justify-content:center;align-items:flex-start;background:#050505;min-height:0;overflow:hidden}
.stage .dev{width:100%;height:100%;flex:0 0 auto}
.stage iframe{border:0;background:#fff;height:100%;width:100%;display:block;transform-origin:0 0}
.stage.device{align-items:center;background:radial-gradient(circle at 50% 40%,#1a1a1a,#050505)}
.stage.device .dev{border-radius:22px;overflow:hidden;box-shadow:0 0 0 10px #1c1c1c,0 0 0 11px #333,0 20px 60px rgba(0,0,0,.6)}
.devlabel{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);color:var(--muted);font-size:11px;letter-spacing:.04em;pointer-events:none}
/* layers */
.tree{padding:0 6px 20px;font-size:12px}
.node{display:flex;align-items:center;gap:4px;padding:2px 4px;border-radius:5px;cursor:pointer;white-space:nowrap;overflow:hidden}
.node:hover{background:#222}
.node.sel{background:#3a1d0d;color:#fff}
.node .tw{width:14px;flex:0 0 14px;color:var(--muted);text-align:center;font-size:10px}
.node .tg{color:#e9a37a}
.node .cl{color:#8fb4d9}
.node .tx{color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.node.hid{opacity:.45}
.kids{padding-left:12px}
/* inspector */
.field{margin:12px 0 0}
.field label{display:block;color:var(--muted);font-size:12px;margin:0 0 4px}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.row input[type=checkbox]{width:auto}
.crumbs{display:flex;flex-wrap:wrap;gap:2px;margin:8px 0 2px;font-size:12px}
.crumbs a{color:var(--muted);cursor:pointer;text-decoration:none;padding:1px 4px;border-radius:4px}
.crumbs a:hover{background:#262626;color:var(--ink)}
.crumbs a.cur{color:var(--accent)}
.hint{color:var(--muted);font-size:12px;margin:8px 0 0}
.hint b{color:var(--ink);font-weight:600}
.sec{border-top:1px solid var(--line);margin-top:14px;padding-top:12px}
.thumb{max-width:100%;max-height:140px;border-radius:6px;display:block;margin-top:6px;background:#000}
details.adv summary{cursor:pointer;color:var(--muted);font-size:12px;margin-top:14px}
.stale{display:none;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 12px;background:#3a2a0a;border-bottom:1px solid #6b4a12;color:#ffd99a;font-size:12.5px}
.stale.show{display:flex}
.stale b{color:#fff}
.app.has-stale{grid-template-rows:48px auto 1fr}
.boxgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}.boxgrid.two{grid-template-columns:1fr 1fr}.boxgrid.one{grid-template-columns:1fr;flex:1}
.scrub{display:flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:4px 7px;cursor:ew-resize;user-select:none;min-width:0;font-size:12px}
.scrub:hover,.scrub.on{border-color:var(--accent)}
.scrub .sl{color:var(--muted);font-size:10.5px;flex:0 0 auto}.scrub .sv{flex:1;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-variant-numeric:tabular-nums}
.scrub input{flex:1;min-width:0;width:100%;padding:0 2px;font-size:12px;background:#000;border:0;color:#fff;text-align:right}
.scrubov{position:fixed;inset:0;z-index:99999;cursor:ew-resize}
.crow{align-items:center}.crow input[type=color]{width:34px;height:28px;padding:0;border:1px solid var(--line);border-radius:6px;background:none;flex:0 0 34px}
.crow select{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:4px}
.addmenu{position:fixed;z-index:1000;width:340px;background:#151515;border:1px solid var(--line);border-radius:12px;padding:10px;box-shadow:0 16px 40px rgba(0,0,0,.6)}
.am-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;font-weight:600}
.am-head button{padding:3px 8px;font-size:11.5px}.am-head button.on,.ltools button.on{border-color:var(--accent);color:#fff}
.am-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.am-grid button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;font-size:12px}
.am-grid button b{font-size:18px;line-height:1;color:var(--accent)}
.am-grid button:hover{border-color:var(--accent)}
.scopebar{margin:12px 0 4px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);font-size:12px}
.scopebar.ph{border-color:#4aa3ff;background:rgba(74,163,255,.08)}
.scopebar button.on{border-color:var(--accent);color:#fff}.scopebar.ph button[data-scope=phone].on{border-color:#4aa3ff;background:#4aa3ff;color:#fff}
.chip{font-size:11px;padding:3px 7px;border-radius:999px;background:#222;border:1px solid var(--line);color:var(--ink)}
.scopetag{font-size:11.5px;font-weight:600;color:#fff;background:#4aa3ff;border-radius:999px;padding:4px 10px}
body.phone-scope .scrub{border-color:rgba(74,163,255,.45)}
.node .scm{color:#4aa3ff;font-size:11px;margin-right:2px}
.warn{margin:10px 0 0;padding:8px 10px;border-left:3px solid #e8a33d;background:rgba(232,163,61,.1);font-size:12px;line-height:1.45;color:var(--ink)}
.warn code{color:#e9a37a}
.agrid{display:grid;grid-template-columns:repeat(3,26px);gap:4px}
.agrid .ag{width:26px;height:26px;padding:0;border-radius:5px;position:relative}
.agrid .ag::after{content:"";position:absolute;inset:9px;border-radius:2px;background:#666}
.agrid .ag.on{border-color:var(--accent)}.agrid .ag.on::after{background:var(--accent)}
.row button.on{border-color:var(--accent);color:#fff}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#222;border:1px solid #444;padding:9px 14px;border-radius:9px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:9}
.toast.show{opacity:1}
.welcome{padding:14px;color:var(--muted)}
.welcome li{margin:6px 0}
kbd{background:#262626;border:1px solid #3a3a3a;border-radius:4px;padding:0 5px;font-size:11px;color:var(--ink)}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <span class="brand">Site Editor</span>
    <select id="pageSel" title="Page"></select>
    <div class="grp" title="Edit: click to select, double-click text to type. Preview: use the page normally.">
      <button id="modeEdit" class="on">Edit</button><button id="modePrev">Preview</button>
    </div>
    <div class="grp" title="Screen width">
      <button data-dev="desk" class="on">Desktop</button><button data-dev="tablet" title="iPad, 820 × 1180">iPad</button><button data-dev="phone" title="iPhone 13 Pro, 390 × 844">iPhone</button><button id="rot" disabled title="Switch between portrait and landscape">Portrait</button>
    </div>
    <div class="grp">
      <button id="undo" title="Undo (Ctrl+Z)" disabled>Undo</button><button id="redo" title="Redo (Ctrl+Shift+Z)" disabled>Redo</button>
    </div>
    <span class="scopetag" id="scopeTag" hidden title="Layout and style changes only affect phones. Change this in the inspector.">Editing phone only</span>
    <div class="grp"><button id="addBtn" class="primary" title="Add a box, text, button, image…">+ Add</button></div>
    <div class="grp"><button id="guides" class="on" title="Show margins, padding and what the selection is pinned to">Guides</button>
    </div>
    <span class="sp"></span>
    <span class="status" id="status">Loading…</span>
    <button id="discard" class="danger" disabled title="Throw away unsaved changes on this page">Discard</button>
    <button id="save" class="primary" disabled title="Save this page to your site folder (Ctrl+S)">Save page</button>
  </div>
  <div class="stale" id="stale"><span><b>This page was changed on disk</b> (by Claude or another editor window) after you started editing here. Your unsaved edits are based on the older copy.</span>
    <button id="staleReload">Load the newer page (drop my unsaved edits)</button><button id="staleKeep">Keep my edits</button></div>
  <div class="main">
    <aside class="side"><div class="sidehead"><h3>Layers</h3><div class="ltools" id="ltools">
      <button data-lt="up" title="Move up among its neighbours">&#8593;</button><button data-lt="down" title="Move down among its neighbours">&#8595;</button>
      <button data-lt="out" title="Move out of its parent (one level up the hierarchy)">&#8676;</button><button data-lt="in" title="Move into the block above it (one level down the hierarchy)">&#8677;</button>
    </div></div><div class="tree" id="tree"></div><p class="hint ltip">Drag layers to reorder. Drop on the middle of a layer to put it inside.</p></aside>
    <div class="stage" id="stage"><div class="dev" id="dev"><iframe id="frame" title="Page"></iframe></div><span class="devlabel" id="devlabel"></span></div>
    <aside class="insp" id="insp"></aside>
  </div>
</div>
<input type="file" id="filePick" hidden>
<div class="toast" id="toast"></div>
<script>
'use strict';
const $=s=>document.querySelector(s);
const frame=$('#frame'),tree=$('#tree'),insp=$('#insp'),stage=$('#stage');
const TEXTY=new Set(['B','I','EM','STRONG','A','BR','SPAN','CODE','SMALL','SUP','SUB','U','KBD','MARK','S']);
const SKIP=new Set(['SCRIPT','STYLE','NOSCRIPT','LINK','META','TEMPLATE']);
const MEDIA=new Set(['IMG','VIDEO','SOURCE']);

let pages=[],cur=null,mode='edit',selId=null,editing=null,nextId=1,open=new Set(),pendingSel=null,keepScroll=0;

// ---------- utils ----------
function toast(msg,ms=2200){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),ms)}
async function api(path,opts={}){const r=await fetch(path,opts);const j=await r.json().catch(()=>({}));if(!r.ok||j.error)throw new Error(j.error||('HTTP '+r.status));return j}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function serialize(doc){return '<!doctype html>\n'+doc.documentElement.outerHTML+'\n'}
function maxId(doc){let m=0;doc.querySelectorAll('[data-ed]').forEach(e=>{m=Math.max(m,+e.dataset.ed||0)});return m}
function renumber(el){[el,...el.querySelectorAll('*')].forEach(e=>{if(e.nodeType===1)e.setAttribute('data-ed',String(nextId++))})}
function srcEl(id){return cur&&cur.doc.querySelector(`[data-ed="${id}"]`)}
function liveDoc(){try{return frame.contentDocument}catch(e){return null}}
function liveEl(id){const d=liveDoc();return d&&d.querySelector(`[data-ed="${id}"]`)}
function pageDir(){const p=cur.path;return p.includes('/')?p.slice(0,p.lastIndexOf('/')+1):''}
function isTexty(el){return [...el.querySelectorAll('*')].every(c=>TEXTY.has(c.tagName))}
function label(el){
  const cls=(el.getAttribute('class')||'').trim().split(/\s+/).filter(c=>c&&!/^m-[a-z0-9]{4,}$/.test(c))[0];
  let t='';
  if(MEDIA.has(el.tagName))t=(el.getAttribute('src')||el.getAttribute('data-src')||'').split('/').pop();
  else t=(el.textContent||'').replace(/\s+/g,' ').trim();
  return {tag:el.tagName.toLowerCase(),cls:el.id?'#'+el.id:(cls?'.'+cls:''),txt:t.slice(0,40)};
}

// ---------- pages ----------
async function loadPages(){
  pages=await api('/__ed/api/pages');
  $('#pageSel').innerHTML=pages.map(p=>`<option value="${esc(p.path)}">${esc(p.url==='/'?'Home  ( / )':p.url)}</option>`).join('');
}
async function openPage(path,{reloadFrame=true}={}){
  if(editing)finishEdit();
  const j=await api('/__ed/api/page?path='+encodeURIComponent(path));
  const pg=pages.find(p=>p.path===path)||{path,url:'/'+path};
  const doc=new DOMParser().parseFromString(j.html,'text/html');
  cur={path,url:pg.url,src:j.html,doc,dirty:j.draft,hist:[],fut:[]};
  showStale(!!j.stale);
  nextId=maxId(doc)+1;selId=null;open=new Set();
  $('#pageSel').value=path;
  if(reloadFrame){keepScroll=0;frame.src=pg.url}
  renderTree();renderInsp();updateBar();
}

function showStale(on){$('#stale').classList.toggle('show',on);document.querySelector('.app').classList.toggle('has-stale',on)}
$('#staleReload').onclick=async()=>{await api('/__ed/api/discard?path='+encodeURIComponent(cur.path),{method:'POST'});await openPage(cur.path);toast('Loaded the newer page')};
$('#staleKeep').onclick=()=>{showStale(false);toast('Keeping your edits. Saving will replace the newer copy on disk.',4000)};
/* re-check when you come back to this tab, so changes made meanwhile are noticed */
document.addEventListener('visibilitychange',async()=>{if(document.hidden||!cur)return;try{
  if(cur.dirty){const j=await api('/__ed/api/page?path='+encodeURIComponent(cur.path));showStale(!!j.stale)}
  else{await openPage(cur.path,{reloadFrame:true})}}catch(e){}});

// ---------- change pipeline ----------
async function change(fn,{rerender=true,label:lbl}={}){
  cur.hist.push(cur.src);if(cur.hist.length>80)cur.hist.shift();cur.fut=[];
  fn(cur.doc);
  await commitDraft(rerender);
  if(lbl)toast(lbl);
}
async function commitDraft(rerender){
  cur.src=serialize(cur.doc);cur.dirty=true;
  await api('/__ed/api/draft?path='+encodeURIComponent(cur.path),{method:'POST',body:cur.src});
  if(rerender)reloadFrame();
  renderTree();renderInsp();updateBar();
}
function reloadFrame(){const w=frame.contentWindow;keepScroll=w?w.scrollY:0;pendingSel=selId;frame.src=cur.url+(cur.url.includes('?')?'&':'?')+'_='+Date.now()}
async function undo(){if(!cur.hist.length)return;cur.fut.push(cur.src);cur.src=cur.hist.pop();cur.doc=new DOMParser().parseFromString(cur.src,'text/html');await api('/__ed/api/draft?path='+encodeURIComponent(cur.path),{method:'POST',body:cur.src});cur.dirty=true;reloadFrame();renderTree();renderInsp();updateBar()}
async function redo(){if(!cur.fut.length)return;cur.hist.push(cur.src);cur.src=cur.fut.pop();cur.doc=new DOMParser().parseFromString(cur.src,'text/html');await api('/__ed/api/draft?path='+encodeURIComponent(cur.path),{method:'POST',body:cur.src});cur.dirty=true;reloadFrame();renderTree();renderInsp();updateBar()}
async function save(){
  if(editing)finishEdit();
  if(!cur.dirty)return;
  try{await api('/__ed/api/save?path='+encodeURIComponent(cur.path),{method:'POST',body:cur.src});cur.dirty=false;updateBar(true);toast('Saved to your site folder. Push it in GitHub Desktop to go live.',3500)}
  catch(e){toast('Save failed: '+e.message,5000)}
}
async function discard(){
  if(!cur.dirty||!confirm('Throw away all unsaved changes on this page?'))return;
  await api('/__ed/api/discard?path='+encodeURIComponent(cur.path),{method:'POST'});
  await openPage(cur.path);toast('Changes discarded')
}
function updateBar(justSaved){
  const s=$('#status');
  s.className='status'+(cur&&cur.dirty?' dirty':justSaved?' saved':'');
  s.textContent=!cur?'':cur.dirty?'Unsaved changes':justSaved?'Saved':'No changes';
  $('#save').disabled=!(cur&&cur.dirty);$('#discard').disabled=!(cur&&cur.dirty);
  $('#undo').disabled=!(cur&&cur.hist.length);$('#redo').disabled=!(cur&&cur.fut.length);
}

// ---------- iframe wiring ----------
frame.addEventListener('load',()=>{
  const d=liveDoc();if(!d)return;
  // follow links clicked in Preview mode
  const p=decodeURIComponent(frame.contentWindow.location.pathname);
  const match=pages.find(x=>x.url===p||('/'+x.path)===p);
  if(match&&cur&&match.path!==cur.path){openPage(match.path,{reloadFrame:false});}
  if(keepScroll){frame.contentWindow.scrollTo(0,keepScroll);setTimeout(()=>frame.contentWindow.scrollTo(0,keepScroll),120)}
  const st=d.createElement('style');st.id='__ed_css';
  st.textContent=`.__ed_box{position:fixed;pointer-events:none;z-index:2147483646;border:2px solid #e85002;border-radius:3px;display:none}
  .__ed_hov{position:fixed;pointer-events:none;z-index:2147483645;border:1px dashed #e85002;display:none}
  .__ed_tag{position:absolute;left:-2px;top:-20px;background:#e85002;color:#fff;font:600 11px/18px system-ui;padding:0 6px;border-radius:3px 3px 0 0;white-space:nowrap}
  [contenteditable=true]{outline:2px solid #e85002!important;outline-offset:2px;cursor:text}
  html.__ed_edit [data-ed]{pointer-events:auto!important}
  html.__ed_edit a,html.__ed_edit button{cursor:default}
  .__ed_g>div{position:fixed;pointer-events:none;z-index:2147483644}
  .__ed_gm{background:rgba(255,153,51,.18);outline:1px dashed rgba(255,153,51,.8)}
  .__ed_gp{background:rgba(64,200,120,.16);outline:1px dashed rgba(64,200,120,.85)}
  .__ed_gpar{outline:1px dashed #4aa3ff}
  .__ed_gpar span{position:absolute;right:0;top:-18px;background:#4aa3ff;color:#fff;font:600 10px/16px system-ui;padding:0 5px;border-radius:3px 3px 0 0;white-space:nowrap}
  .__ed_gv{border-left:1px solid #ff3d7f}.__ed_gh{border-top:1px solid #ff3d7f}
  .__ed_gc{border-left:1px dashed #ff3d7f}.__ed_gcx{border-top:1px dashed #ff3d7f}
  .__ed_gv span,.__ed_gh span,.__ed_gc span,.__ed_gcx span{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#ff3d7f;color:#fff;font:600 10px/15px system-ui;padding:0 4px;border-radius:3px;white-space:nowrap}
  .__ed_drop{position:fixed;display:none;pointer-events:none;z-index:2147483647;outline:2px solid #4aa3ff;box-shadow:0 0 0 1px #fff}
  .__ed_drop.in{outline:2px dashed #4aa3ff;background:rgba(74,163,255,.14);box-shadow:none}
  .__ed_drop.no{outline-color:#ff4d4d}
  .__ed_drop span{position:absolute;left:0;top:0;transform:translateY(-100%);background:#4aa3ff;color:#fff;font:600 10px/16px system-ui;padding:0 6px;border-radius:3px;white-space:nowrap}
  .__ed_drop.no span{background:#ff4d4d}
  html.__ed_edit .__ed_dragging{cursor:grabbing!important}`;
  d.head.appendChild(st);
  const box=d.createElement('div');box.className='__ed_box';box.innerHTML='<span class="__ed_tag"></span>';
  const hov=d.createElement('div');hov.className='__ed_hov';
  d.body.appendChild(box);d.body.appendChild(hov);
  d.documentElement.classList.toggle('__ed_edit',mode==='edit');
  const pick=e=>{let n=e.target;while(n&&n.nodeType===1&&!n.hasAttribute('data-ed'))n=n.parentElement;return n&&n.nodeType===1?n:null};
  d.addEventListener('mousemove',e=>{if(mode!=='edit'||editing){hov.style.display='none';return}const n=pick(e);place(hov,n)},true);
  d.addEventListener('mouseleave',()=>{hov.style.display='none'});
  d.addEventListener('click',e=>{
    if(mode!=='edit'||suppressClick)return;
    if(editing&&editing.contains(e.target))return;
    e.preventDefault();e.stopPropagation();
    if(editing)finishEdit();
    const n=pick(e);if(n)select(n.dataset.ed);
  },true);
  d.addEventListener('dblclick',e=>{
    if(mode!=='edit')return;e.preventDefault();e.stopPropagation();
    const n=pick(e);if(n)startEdit(n.dataset.ed);
  },true);
  d.addEventListener('submit',e=>{if(mode==='edit')e.preventDefault()},true);
  d.addEventListener('keydown',keys,true);
  wireDrag(d);
  d.addEventListener('scroll',()=>{drawSel()},true);
  frame.contentWindow.addEventListener('resize',drawSel);
  if(pendingSel){selId=pendingSel;pendingSel=null}

function place(b,el){

// ---------- selection ----------
function select(id,{scroll=false}={}){

  if(el){let p=el.parentElement;while(p&&p!==cur.doc.body){if(p.dataset.ed)open.add(p.dataset.ed);p=p.parentElement}}

// ---------- inline text editing ----------
function startEdit(id){
  const L=srcEl(id),live=liveEl(id);if(!L||!live)return;
  if(!L.textContent.trim()&&!MEDIA.has(L.tagName)){select(id);return}
  if(!isTexty(L)){select(id);toast('This block holds other blocks. Double-click a piece of text inside it.');return}
  if(editing)finishEdit();
  select(id);editing=live;live.setAttribute('contenteditable','true');live.setAttribute('spellcheck','true');live.focus();
  const d=liveDoc(),r=d.createRange();r.selectNodeContents(live);const s=d.getSelection();s.removeAllRanges();s.addRange(r);

function finishEdit(){
  const live=editing;if(!live)return;editing=null;
  live.removeAttribute('contenteditable');live.removeAttribute('spellcheck');
  const id=live.dataset.ed,L=srcEl(id);if(!L)return;
  const tmp=live.cloneNode(true);
  tmp.querySelectorAll('[contenteditable],[spellcheck]').forEach(e=>{e.removeAttribute('contenteditable');e.removeAttribute('spellcheck')});
  let html=tmp.innerHTML.replace(/<div>/g,'<br>').replace(/<\/div>/g,'').replace(/&nbsp;/g,' ');
  if(html===L.innerHTML)return;
  change(()=>{L.innerHTML=html;L.querySelectorAll('*').forEach(e=>{if(!e.dataset.ed)e.setAttribute('data-ed',String(nextId++))})},{rerender:false});
}

// ---------- layers tree ----------
function renderTree(){
  if(!cur){tree.innerHTML='';return}
  const build=(el,depth)=>{
    let h='';
    for(const c of el.children){
      if(SKIP.has(c.tagName)||!c.dataset.ed)continue;
      const kids=[...c.children].some(k=>!SKIP.has(k.tagName)&&k.dataset.ed);
      const id=c.dataset.ed,isOpen=open.has(id),l=label(c);
      h+=`<div class="node${id===selId?' sel':''}${c.hasAttribute('hidden')?' hid':''}" data-id="${id}" draggable="true"><span class="tw" data-tw="${kids?id:''}">${kids?(isOpen?'▾':'▸'):''}</span><span class="tg">${l.tag}</span><span class="cl">${esc(l.cls)}</span>${scopeCls(c)?'<span class="scm" title="Has phone or desktop-only changes">±</span>':''}<span class="tx">${esc(l.txt)}</span></div>`;
      if(kids&&isOpen)h+=`<div class="kids">${build(c,depth+1)}</div>`;
    }
    return h;
  };
  tree.innerHTML=build(cur.doc.body,0)||'<div class="welcome">No elements.</div>';
}

// =====================================================================
// Moving blocks: shared by Layers drag, page drag and the hierarchy buttons
// =====================================================================
const VOID=new Set(['IMG','VIDEO','SOURCE','BR','HR','INPUT','META','LINK','IFRAME','SVG','PATH','TEXTAREA','SELECT','PICTURE','CANVAS','AUDIO','TRACK','WBR']);
const LEAF=new Set(['P','H1','H2','H3','H4','H5','H6','SPAN','B','I','EM','STRONG','SMALL','CODE','LABEL','SUMMARY','BUTTON','TD','TH','OPTION','SUP','SUB']);
function canHold(el){if(!el)return false;const t=el.tagName.toUpperCase();if(VOID.has(t)||SKIP.has(t))return false;if(LEAF.has(t))return false;if(t==='A')return [...el.children].some(c=>!VOID.has(c.tagName.toUpperCase())||c.children.length);return true}
function canMove(L,T,where){
  if(!L||!T||L===T)return 'Pick a different spot';
  if(L.contains(T))return 'Can’t move a block inside itself';
  if(where==='inside'&&!canHold(T))return 'That block can’t hold other blocks';
  if(where!=='inside'&&(T===cur.doc.body||!T.parentElement||T.parentElement===cur.doc.documentElement))return 'Pick a spot inside the page';
  return '';
}
function moveBlock(id,targetId,where,{silent}={}){
  const L=srcEl(id),T=srcEl(targetId),why=canMove(L,T,where);
  if(why){if(!silent)toast(why);return Promise.resolve(false)}
  if(where==='inside')open.add(targetId);
  return change(()=>{where==='before'?T.before(L):where==='after'?T.after(L):T.appendChild(L)},{label:where==='inside'?'Moved into '+lbl(T):'Moved'}).then(()=>true);
}
function lbl(el){const l=label(el);return l.tag+l.cls}
function outLevel(id){
  const L=srcEl(id),P=L&&L.parentElement;
  if(!P||P===cur.doc.body){toast('Already at the top level');return}
  change(()=>P.after(L),{label:'Moved out of '+lbl(P)});
}
function intoAbove(id){
  const L=srcEl(id);if(!L)return;let prev=L.previousElementSibling;
  while(prev&&(SKIP.has(prev.tagName)||!prev.dataset.ed))prev=prev.previousElementSibling;
  if(!prev){toast('Nothing above it to move into');return}
  if(!canHold(prev)){toast('The block above ('+lbl(prev)+') can’t hold other blocks');return}
  open.add(prev.dataset.ed);
  change(()=>prev.appendChild(L),{label:'Moved into '+lbl(prev)});
}
function sibMove(id,dir){
  const el=srcEl(id);if(!el)return;
  if(dir<0){const p=el.previousElementSibling;if(!p){toast('Already first in its group');return}change(()=>p.before(el))}
  else{const n=el.nextElementSibling;if(!n){toast('Already last in its group');return}change(()=>n.after(el))}
}

// ---------- Layers drag and drop ----------
let treeDrag=null;
function treeZone(node,e){
  const r=node.getBoundingClientRect(),y=(e.clientY-r.top)/r.height,T=srcEl(node.dataset.id);
  if(canHold(T)){return y<.28?'before':y>.72?'after':'inside'}

}
function clearTreeMarks(){tree.querySelectorAll('.drop-before,.drop-after,.drop-inside,.drop-no').forEach(n=>n.classList.remove('drop-before','drop-after','drop-inside','drop-no'))}

});
tree.addEventListener('dragover',e=>{
  if(!treeDrag)return;const n=e.target.closest('.node');clearTreeMarks();if(!n)return;
  const z=treeZone(n,e),ok=!canMove(srcEl(treeDrag.id),srcEl(n.dataset.id),z);

tree.addEventListener('dragleave',e=>{if(!tree.contains(e.relatedTarget))clearTreeMarks()});

// Copy / paste between pages (carries the element's own styles along)
// =====================================================================
const CLIP_KEY='mkSiteEditorClip';

function copySel(){
  const L=selId&&srcEl(selId),live=selId&&liveEl(selId);if(!L){toast('Select something to copy first');return}

// Keep only rules the target page doesn't already style, so shared classes (like .label) keep this page's look
function newRulesFor(css){
  const ld=liveDoc(),sels=new Set(),frames=new Set();
  const walk=rs=>{for(const r of rs){if(r.type===1)sels.add(r.selectorText);else if(r.type===7)frames.add(r.name);else if(r.cssRules)walk(r.cssRules)}};

  for(const r of sheet.cssRules){
    if(r.type===1){if(!sels.has(r.selectorText))out.push(r.cssText)}
    else if(r.type===7){if(!frames.has(r.name))out.push(r.cssText)}
    else if(r.type===4||r.type===12){

      if(keep.length)out.push(`@${r.type===4?'media':'supports'} ${r.conditionText}{${keep.map(x=>x.cssText).join('')}}`)}

let showGuides=true;

  const auto=v=>v==='auto';

  const v=(spec.top&&spec.bottom)?'stretch':spec.bottom&&!spec.top?'bottom':(spec.top&&/50%/.test(spec.top))?'middle':'top';
  return {pos,cb,C,r,h,v,gap:{left:Math.round(r.left-C.left),right:Math.round(C.right-r.right),top:Math.round(r.top-C.top),bottom:Math.round(C.bottom-r.bottom)}};

    const walk=rs=>{for(const r of rs){if(r.type===1){try{if(live.matches(r.selectorText))take(r.style)}catch(x){}}else if(r.type===4&&d.defaultView.matchMedia(r.conditionText||r.media.mediaText).matches)walk(r.cssRules)}};walk(rules)}

function hideGuides(){const d=liveDoc();const g=d&&d.querySelector('.__ed_g');if(g)g.innerHTML=''}

  }else if(pcs&&/flex|grid/.test(pcs.display)){

  h+=clipReport(live);

    'opacity':v=>{if(v==='')return {opacity:''};const n=pct(v);return {opacity:n==null?v:String(Math.max(0,Math.min(100,n))/100)}},
    '--ed-bg-a':v=>{const l=liveEl(selId),c=parseColor(cssOf(l).backgroundColor);const n=pct(v);return {'background-color':v===''?'':rgba(c.hex,n==null?1:Math.max(0,Math.min(100,n))/100)}},
    '--ed-shadow':v=>{const n=pct(v)||0;const l=liveEl(selId);if(l)l.dataset.edShadow=n;return {'box-shadow':n?`0 ${Math.round(n*.35)}px ${n}px rgba(0,0,0,.45)`:''}},
    '--ed-chamfer':v=>{const n=pct(v)||0;return {'clip-path':n?chamferPath(n):''}},
    'border-width':v=>{const out={'border-width':v};const l=liveEl(selId);if(v&&l&&cssOf(l).borderTopStyle==='none')out['border-style']='solid';return out},
  };
}

// =====================================================================
// Add element menu
// =====================================================================
const EDGE='1px solid color-mix(in srgb, currentColor 22%, transparent)';
const ADD_ITEMS=[
  ['box','Box','▢','A container you can drop things into',`<div style="padding:24px;border:${EDGE};border-radius:12px;min-height:96px"></div>`],
  ['text','Text','¶','A paragraph',`<p>New text. Double-click to edit.</p>`],
  ['heading','Heading','H','A large title',`<h2 class="display">New heading</h2>`],
  ['label','Label','·','Small mono caption, like the section labels',`<span class="label">Label</span>`],
  ['button','Button','◉','An orange button link',`<a class="btn primary" href="#">Button</a>`],
  ['button2','Outline button','○','A secondary button link',`<a class="btn" href="#">Button</a>`],
  ['link','Link','↗','A text link',`<a href="#">Link text</a>`],
  ['image','Image','▣','Then use Replace to pick your image',`<img src="/assets/brand/mk.webp" alt="" style="display:block;max-width:100%;height:auto;border-radius:12px">`],
  ['video','Video','▶','Looping, muted video. Use Replace to pick it',`<video src="" muted loop playsinline autoplay style="display:block;width:100%;border-radius:12px;background:#111;aspect-ratio:16/9"></video>`],
  ['row','Row','⇹','Side-by-side items that wrap',`<div style="display:flex;flex-wrap:wrap;gap:12px;align-items:center;min-height:48px"></div>`],
  ['cols2','2 columns','▥','Two equal columns',`<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:24px"><div style="padding:24px;border:${EDGE};border-radius:12px;min-height:96px"><p>Column one</p></div><div style="padding:24px;border:${EDGE};border-radius:12px;min-height:96px"><p>Column two</p></div></div>`],
  ['cols3','3 columns','▦','Three equal columns',`<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:24px">${[1,2,3].map(i=>`<div style="padding:24px;border:${EDGE};border-radius:12px;min-height:96px"><p>Column ${i}</p></div>`).join('')}</div>`],
  ['divider','Divider','—','A thin line',`<hr style="border:0;border-top:${EDGE};margin:24px 0">`],
  ['spacer','Spacer','↕','Empty space. Drag its height',`<div style="height:48px"></div>`],
];
let addWhere='after';
function buildAddMenu(){
  const m=document.createElement('div');m.id='addMenu';m.className='addmenu';m.hidden=true;
  m.innerHTML=`<div class="am-head"><span>Add</span><div class="row"><button data-aw="after" class="on">After selection</button><button data-aw="inside">Inside selection</button></div></div>
  <div class="am-grid">${ADD_ITEMS.map(([k,t,ic,d])=>`<button data-add="${k}" title="${esc(d)}"><b>${ic}</b><span>${t}</span></button>`).join('')}</div>
  <p class="hint" style="margin:8px 2px 0">Nothing selected? It goes at the end of the page. You can drag it anywhere after.</p>`;
  document.body.appendChild(m);
  m.addEventListener('click',e=>{const w=e.target.closest('[data-aw]');if(w){addWhere=w.dataset.aw;m.querySelectorAll('[data-aw]').forEach(b=>b.classList.toggle('on',b===w));return}
    const b=e.target.closest('[data-add]');if(b){m.hidden=true;addElement(b.dataset.add)}});
  document.addEventListener('mousedown',e=>{if(!m.hidden&&!m.contains(e.target)&&e.target.id!=='addBtn')m.hidden=true});
  return m;
}
function addElement(kind){
  if(!cur)return;const it=ADD_ITEMS.find(x=>x[0]===kind);if(!it)return;
  const t=cur.doc.createElement('template');t.innerHTML=it[4];const node=t.content.firstElementChild;
  const target=selId&&srcEl(selId);
  let where=addWhere;if(where==='inside'&&target&&!canHold(target)){where='after';toast('That block can’t hold others, so it went right after it')}
  change(doc=>{renumber(node);
    if(!target)(doc.querySelector('main')||doc.body).appendChild(node);
    else if(where==='inside'){target.appendChild(node);open.add(target.dataset.ed)}
    else target.after(node);
    selId=node.dataset.ed},{label:'Added '+it[1].toLowerCase()+(kind==='image'||kind==='video'?'. Use Replace in the inspector to pick the file.':'')});
}

// =====================================================================
// Phone-only / desktop-only styles
// Edits made with "Phone only" go into one <style id="ed-screens"> block as
// media-query rules keyed by a small class (m-xxxx) on the element, so the
// tablet and desktop layout is untouched.
// =====================================================================
const MQ={phone:'(max-width: 600px), (max-height: 500px)',desk:'(min-width: 601px) and (min-height: 501px)'};
let editScope='all';
function scopeCls(el){return [...el.classList].find(c=>/^m-[a-z0-9]{4,}$/.test(c))||''}
function ensureScopeCls(el){let c=scopeCls(el);if(c)return c;
  const used=new Set([...cur.doc.querySelectorAll('[class*="m-"]')].flatMap(e=>[...e.classList]));
  do{c='m-'+Math.random().toString(36).slice(2,6)}while(used.has(c));el.classList.add(c);return c}
function readScreens(doc){
  const st=(doc||cur.doc).getElementById('ed-screens'),out={phone:{},desk:{}};if(!st)return out;
  const re=/\/\*(phone|desk)\*\/\s*@media[^{]*\{([\s\S]*?)\n\}/g;let m;
  while((m=re.exec(st.textContent))){const rr=/\.(m-[a-z0-9]+)\{([^}]*)\}/g;let r;
    while((r=rr.exec(m[2]))){const o=out[m[1]][r[1]]={};r[2].split(';').forEach(d=>{const i=d.indexOf(':');if(i>0)o[d.slice(0,i).trim()]=d.slice(i+1).replace(/!important/,'').trim()})}}
  return out;
}
function writeScreens(doc,data){
  let st=doc.getElementById('ed-screens');
  const block=k=>{const cls=Object.entries(data[k]).filter(([c,o])=>Object.keys(o).length);if(!cls.length)return '';
    return `/*${k}*/\n@media ${MQ[k]}{\n${cls.map(([c,o])=>`.${c}{${Object.entries(o).map(([p,v])=>`${p}:${v} !important`).join(';')}}`).join('\n')}\n}\n`};
  const txt=block('phone')+block('desk');
  if(!txt){if(st)st.remove();return}
  if(!st){st=doc.createElement('style');st.id='ed-screens';doc.head.appendChild(st)}
  st.textContent='\n/* Phone-only and desktop-only tweaks made in the site editor */\n'+txt;
}
function scopedVal(el,p){if(editScope==='all')return el.style.getPropertyValue(p);const c=scopeCls(el);const o=c&&readScreens()[editScope][c];return o&&o[p]!=null?o[p]:''}
function styleScoped(id,props,scope,lbl){
  const L=srcEl(id);if(!L)return Promise.resolve();
  return change(doc=>{const c=ensureScopeCls(L),data=readScreens(doc),o=data[scope][c]||(data[scope][c]={});
    for(const[k,v]of Object.entries(props)){if(v===''||v==null)delete o[k];else o[k]=v}
    writeScreens(doc,data)},{rerender:false,label:lbl}).then(()=>syncScreensLive(id))}
function syncScreensLive(id){
  const d=liveDoc(),L=srcEl(id),v=liveEl(id);if(!d)return;
  if(v&&L){v.className=L.className;L.getAttribute('style')?v.setAttribute('style',L.getAttribute('style')):v.removeAttribute('style')}
  const src=cur.doc.getElementById('ed-screens');let st=d.getElementById('ed-screens');
  if(!src){if(st)st.remove()}else{if(!st){st=d.createElement('style');st.id='ed-screens';d.head.appendChild(st)}st.textContent=src.textContent}
  drawSel();
}
function clearScoped(id,scope){const L=srcEl(id);const c=L&&scopeCls(L);if(!c)return;
  change(doc=>{const data=readScreens(doc);delete data[scope][c];writeScreens(doc,data);if(!data.phone[c]&&!data.desk[c])L.classList.remove(c)},{rerender:false,label:(scope==='phone'?'Phone':'Tablet & desktop')+' changes cleared'}).then(()=>{syncScreensLive(id);renderInsp()})}
function scopePanel(el){
  const c=scopeCls(el),data=readScreens(),ph=c&&data.phone[c],dk=c&&data.desk[c];
  const list=o=>Object.keys(o).map(k=>k==='display'&&o[k]==='none'?'hidden':k).join(', ');
  let h=`<div class="scopebar ${editScope==='phone'?'ph':''}"><div class="row"><span>Changes apply to</span><button data-scope="all" class="${editScope==='all'?'on':''}">All screens</button><button data-scope="phone" class="${editScope==='phone'?'on':''}">Phone only</button></div>`;
  if(editScope==='phone')h+=`<p class="hint" style="margin:6px 0 0">Layout and appearance changes now only affect phones. Text, links and images are shared by every screen.</p>`;
  else if(dev!=='phone')h+=`<p class="hint" style="margin:6px 0 0">Switch to the iPhone view to make phone-only changes.</p>`;
  h+=`<div class="row" style="margin-top:6px">${ph&&Object.keys(ph).length?`<span class="chip">Phone: ${esc(list(ph))}</span><button data-clrscope="phone">Clear</button>`:''}${dk&&Object.keys(dk).length?`<span class="chip">Tablet &amp; desktop: ${esc(list(dk))}</span><button data-clrscope="desk">Clear</button>`:''}</div>
  <div class="row" style="margin-top:6px"><button data-vis="phone" class="${ph&&ph.display==='none'?'on':''}">Hide on phone</button><button data-vis="desk" class="${dk&&dk.display==='none'?'on':''}">Hide on tablet &amp; desktop</button></div></div>`;
  return h;
}
function wireScope(el){
  const id=el.dataset.ed;
  insp.querySelectorAll('[data-scope]').forEach(b=>b.addEventListener('click',()=>{setScope(b.dataset.scope);renderInsp()}));
  insp.querySelectorAll('[data-clrscope]').forEach(b=>b.addEventListener('click',()=>clearScoped(id,b.dataset.clrscope)));
  insp.querySelectorAll('[data-vis]').forEach(b=>b.addEventListener('click',()=>{const k=b.dataset.vis,c=scopeCls(el),o=c&&readScreens()[k][c],on=o&&o.display==='none';
    styleScoped(id,{display:on?'':'none'},k,on?'Shown again':(k==='phone'?'Hidden on phones (still in Layers)':'Hidden on tablet and desktop (still in Layers)')).then(()=>{renderTree();renderInsp()})}));
}
function setScope(s){editScope=s;document.body.classList.toggle('phone-scope',s==='phone');const t=$('#scopeTag');if(t)t.hidden=s!=='phone'}

(async()=>{
  try{await loadPages();const want=new URLSearchParams(location.search).get('page');await openPage(want&&pages.some(p=>p.path===want)?want:'index.html')}
  catch(e){$('#status').textContent='Could not reach the editor server. Is the Edit Site window still open?'}
})();
</script>
